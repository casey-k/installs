---
- name: Ensure jq is installed
  community.general.homebrew:
    name: jq
    state: present

- name: Ensure Claude scripts directory exists
  file:
    path: ~/.claude/scripts
    state: directory

- name: Symlink Claude statusline script
  file:
    src: "{{ role_path }}/files/statusline.sh"
    dest: ~/.claude/scripts/statusline.sh
    state: link
    force: yes

- name: Ensure Claude settings.json exists
  copy:
    content: "{}\n"
    dest: ~/.claude/settings.json
    force: no

- name: Configure statusLine in Claude settings.json
  shell: |
    set -euo pipefail
    desired='{"type":"command","command":"~/.claude/scripts/statusline.sh"}'
    current=$(jq -c '.statusLine // empty' ~/.claude/settings.json)
    if [ "$current" != "$desired" ]; then
      tmp=$(mktemp)
      jq --argjson sl "$desired" '.statusLine = $sl' ~/.claude/settings.json > "$tmp"
      mv "$tmp" ~/.claude/settings.json
      echo changed
    fi
  register: claude_statusline_patch
  changed_when: claude_statusline_patch.stdout == "changed"
